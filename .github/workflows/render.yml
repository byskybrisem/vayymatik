name: Shorts render

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Konu klasörü (topics/<konu>)"
        required: true
        default: "redbull"
  push:
    branches: ["main", "claude/**"]
    paths: ["topics/**", "engine/**", "vayy/**", "brand/**", "assets/**", ".github/workflows/render.yml"]
  pull_request:
    paths: ["topics/**", "engine/**", "vayy/**", "brand/**", "assets/**", ".github/workflows/render.yml"]

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      TOPIC: ${{ github.event.inputs.topic || 'redbull' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: engine/package-lock.json

      - name: Sistem paketleri
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Python bağımlılıkları
        run: python -m pip install -r requirements.txt

      - name: Node bağımlılıkları
        working-directory: engine
        run: npm ci --no-audit --no-fund

      - name: Ses modeli önbelleği
        uses: actions/cache@v4
        with:
          path: .cache/voices
          key: piper-tr_TR-fahrettin-medium-v1

      - name: Remotion tarayıcısı (chrome-headless-shell)
        working-directory: engine
        run: npx remotion browser ensure

      - name: Video üret (tek komut) + QA
        run: python -m vayy build "$TOPIC" --concurrency "$(nproc)"

      - name: Teslim dosyalarını yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TOPIC }}-shorts
          path: |
            deliverables/${{ env.TOPIC }}/
          if-no-files-found: warn
          retention-days: 30
