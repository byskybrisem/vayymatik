name: Shorts render

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Konu klasörü (topics/<konu>)"
        required: true
        default: "redbull"
  push:
    branches: ["main", "claude/**"]
    paths: ["topics/**", "engine/**", "vayy/**", "brand/**", "assets/**", ".github/workflows/render.yml"]
  pull_request:
    paths: ["topics/**", "engine/**", "vayy/**", "brand/**", "assets/**", ".github/workflows/render.yml"]

concurrency:
  group: render-${{ github.ref }}-${{ github.event.inputs.topic || 'redbull' }}
  cancel-in-progress: true

jobs:
  studio-benchmarks:
    if: github.event.inputs.topic == 'studio-benchmarks'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libxrender1 libxi6 libxxf86vm1 libxfixes3 libxkbcommon0 libgl1
      - run: bash scripts/blender-lts.sh
      - run: python -m pip install numpy scipy soundfile
      - run: python -m vayy.studio.benchmarks
        env:
          OMP_NUM_THREADS: "2"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-benchmarks
          path: deliverables/studio-benchmarks/
          if-no-files-found: error
          retention-days: 30

  render:
    if: github.event.inputs.topic != 'studio-benchmarks'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      TOPIC: ${{ github.event.inputs.topic || 'redbull' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: engine/package-lock.json

      - name: Sistem paketleri
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Blender gereksinimi
        run: |
          if python -c 'import json,os,sys; from pathlib import Path; topic=json.loads((Path("topics") / os.environ["TOPIC"].removesuffix("@wide") / "topic.json").read_text()); sys.exit(0 if any(s["type"] == "cinematic" for s in topic["scenes"]) else 1)'; then
            bash scripts/blender-lts.sh
            export PATH="$RUNNER_TEMP/blender-4.2.5-linux-x64:$PATH"
            blender --version | head -n 1
          fi

      - name: Python bağımlılıkları
        run: python -m pip install -r requirements.txt

      - name: Node bağımlılıkları
        working-directory: engine
        run: npm ci --no-audit --no-fund

      - name: Ses modeli önbelleği
        uses: actions/cache@v4
        with:
          path: .cache/voices
          key: piper-tr_TR-fahrettin-medium-v1

      - name: Remotion tarayıcısı (chrome-headless-shell)
        working-directory: engine
        run: npx remotion browser ensure

      - name: Render ortamını kaydet
        run: |
          mkdir -p "deliverables/$TOPIC"
          python -m vayy.studio.doctor > "deliverables/$TOPIC/Environment.json"

      - name: Render cache regression
        run: PYTHONPATH=. python tests/checkpoint_regression.py

      - name: Önceki kare aralıklarını geri al
        if: startsWith(env.TOPIC, 'atolye')
        uses: actions/cache/restore@v4
        with:
          path: build/${{ env.TOPIC }}/checkpoints
          key: shots-v1-${{ runner.os }}-${{ env.TOPIC }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: shots-v1-${{ runner.os }}-${{ env.TOPIC }}-

      - name: Video üret (tek komut) + QA
        run: python -m vayy build "$TOPIC" --concurrency "$(nproc)"

      - name: Tamamlanan kare aralıklarını sakla
        if: always() && startsWith(env.TOPIC, 'atolye')
        uses: actions/cache/save@v4
        with:
          path: build/${{ env.TOPIC }}/checkpoints
          key: shots-v1-${{ runner.os }}-${{ env.TOPIC }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Teslim dosyalarını yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TOPIC }}-shorts
          path: |
            deliverables/${{ env.TOPIC }}/
          if-no-files-found: warn
          retention-days: 30
